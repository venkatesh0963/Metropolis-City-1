<title>Metropolis City 1</title>

<style>
/* Layout: full-bleed isometric canvas; goal + stats pills float at top; a dock at the bottom holds
   the category tray and, above it, the type picker for the selected category.
   One deliberate single-theme look (a sunlit pastel diorama), so every color is set explicitly. */
:root{
  --ink:#3a342d;
  --pill:rgba(50,45,40,.86);
  --pill-fg:#fffdf6;
  --sun:#f9d35b;
  --leaf:#a6d8a0;
  --field:#b9cf8c;
  --paper:#f6f1e3;
  --danger:#e0604c;
  --font:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--field);color:var(--ink);font-family:var(--font);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#hud{position:absolute;left:0;right:0;top:10px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}

.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:3px;min-width:3px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto}
.pill{font:600 14px var(--font);background:var(--pill);color:var(--pill-fg);border:0;border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.y{background:var(--sun);color:var(--ink)}
.pill.bad{background:var(--danger);color:#fff}

.fh button{border:0;background:#2c2a26;color:#fff;border-radius:12px;padding:7px 14px;font:600 14px var(--font);cursor:pointer}

#finTabs button.on{background:#2c2a26;color:#fff;border-color:#2c2a26}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin:0 0 12px}

.tile small{display:block;color:var(--mut);font-size:12px}.tile b{display:block;font:700 20px var(--font);margin-top:2px;overflow-wrap:anywhere}.tile em{display:block;font-style:normal;color:var(--mut);font-size:11.5px;margin-top:2px}

.ok{color:var(--ok)}.bad{color:var(--bad)}.mid{color:#b07a14}

.mm{color:#6f6a5e;font-size:12.5px;line-height:1.5;margin:10px 0 14px}

#newsbtn{position:relative}.nbadge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#d9453a;color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:6px;padding:0 5px;vertical-align:middle}.nbadge:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:#f6d9d5;color:#7c2a22}.chip.s1{background:#f4ecd2;color:#6d5410}.chip.s2{background:#f8dfc9;color:#7a3f10}
.post.ok,.post.bad,.post.info{color:#2c2a26}
.post{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid #b9b19c;border-radius:14px;padding:11px 12px;margin:0 0 10px}.post.bad{border-left-color:var(--bad)}.post.ok{border-left-color:var(--ok)}.post.info{border-left-color:#c58b1e}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px var(--font)}

#citcard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:min(92vw,340px);background:rgba(252,248,238,.97);color:#2c2a26;border-radius:16px;padding:12px 14px;box-shadow:0 6px 22px rgba(0,0,0,.28);z-index:7;font:13px/1.45 var(--font)}
#citcard b{font-size:15px}#citcard .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer;color:#6a6458}#citcard .mood{height:7px;border-radius:4px;background:#e4dccb;margin:6px 0 2px;overflow:hidden}#citcard .mood i{display:block;height:100%;background:#6aa84f}

<script>
(()=>{
"use strict";
const N=70,OFF=14;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let W=300,H=500,dpr=1;
const cam={x:0,y:0,z:1.05};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261115);
function hash(i,j,s){let h=(i*374761393+j*668265263+(s||0)*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const rgb=(c,k)=>{k=k||1;return 'rgb('+Math.min(255,c[0]*k|0)+','+Math.min(255,c[1]*k|0)+','+Math.min(255,c[2]*k|0)+')'};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const P=(x,y,h)=>[(x-y)*32,(x+y)*16-(h||0)];

/* ---------- world data ---------- */
const idx=(i,j)=>j*N+i, inb=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
// road arrays hold a type (1 single, 2 two-way, 3 highway); rail arrays hold 0/1.
// Layer 0 = surface, 1 = flyover (elevated), 2 = underground.
const road=new Uint8Array(N*N),froad=new Uint8Array(N*N),uroad=new Uint8Array(N*N);
const rail=new Uint8Array(N*N),frail=new Uint8Array(N*N),urail=new Uint8Array(N*N),mtr=new Uint8Array(N*N),fmr=new Uint8Array(N*N),umtr=new Uint8Array(N*N);
const field=new Uint8Array(N*N),water=new Uint8Array(N*N),tree=new Uint8Array(N*N),scorch=new Uint8Array(N*N);
const ROADS=[road,froad,uroad],RAILS=[rail,frail,urail],KIND={road:ROADS,rail:RAILS,metro:[mtr,fmr,umtr]};
const DEPK={road:new Uint8Array(N*N),rail:new Uint8Array(N*N),metro:new Uint8Array(N*N)},UZ=[-2,-6,-10],uzOf=m=>m<3?UZ[m]:-18;let anyU=false;
function calcDepth(){anyU=false;
  for(const kind of['road','rail','metro']){const D=DEPK[kind],A=KIND[kind][2],q=[];D.fill(9);
    for(let k=0;k<N*N;k++)if(A[k]){anyU=true;if(cnt(kind,2,k%N,(k/N)|0)<=1){D[k]=0;q.push(k)}}
    for(let h=0;h<q.length;h++){const k=q[h],i=k%N,j=(k/N)|0;for(const d of DIRS){const a=i+d[0],b=j+d[1];if(!has(kind,2,a,b))continue;const m=idx(a,b);if(D[m]>D[k]+1){D[m]=D[k]+1;q.push(m)}}}}}

const TS=.75;let terr;const keepDry=new Uint8Array(N*N),mount=new Uint8Array(N*N),sand=new Uint8Array(N*N);

function genWorld(){
  water.fill(0);mount.fill(0);sand.fill(0);
  const prot=(i,j)=>(i>=19&&i<=43&&j>=17&&j<=43)||(i>=12&&i<=18&&j>=16&&j<=22)||(i>=8&&i<=18&&j>=38&&j<=45)||(i>=40&&i<=50&&j>=34&&j<=41)||(j>=24&&j<=28);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const i0=i-OFF,j0=j-OFF,k=idx(i,j),d=Math.hypot(i0-28,j0-28),wn=vnoise(i0*.11+30,j0*.11+30,4);
    let w=(wn<.24&&d>14)||Math.hypot(i0-45,j0-13)<3.2||Math.hypot(i0-9,j0-42)<2.6;
    if(prot(i0,j0))w=false;
    if(Math.abs(j0-riverJ(i0+.5))<riverW(i0+.5))w=true;
    if(j>=N-5+Math.round(vnoise(i0*.25,3,9)*3))w=true;
    const lane=(Math.abs(j0-26)<=1)||(Math.abs(j0-32)<=1&&i0>=21&&i0<=41)||(Math.abs(i0-30)<=1&&j0>=19&&j0<=33)||(Math.abs(i0-24)<=1&&j0>=31&&j0<=41);
    if(lane)w=false;
    water[k]=w?1:0;
    if(!w&&!lane&&!prot(i0,j0)){
      const e=clamp((13-Math.min(i0,j0,55-i0))/13,0,1),m=vnoise(i0*.14+70,j0*.14+70,11)*.65+vnoise(i0*.33,j0*.33,12)*.35+e*.42;
      let lv=m>1.0?3:m>.93?2:m>.76?1:0;
      const hn=vnoise(i0*.075+10,j0*.075+40,13);if(lv<1&&d>16&&hn>.64)lv=hn>.78?2:1;
      mount[k]=Math.min(lv,1);
    }
  }
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=idx(i,j);if(water[k])continue;
    if(Math.min(i,j,N-1-i,N-1-j)===0||DIRS.some(d=>inb(i+d[0],j+d[1])&&water[idx(i+d[0],j+d[1])]))sand[k]=1}
}

  for(let q=0;q<w*h;q++){const v=128+(hash(q%w,(q/w)|0,seed)-.5)*2*amp;d[q*4]=d[q*4+1]=d[q*4+2]=v;d[q*4+3]=255}x.putImageData(id,0,0);return c}
function glintTile(seed){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
  for(let n=0;n<150;n++){const px=hash(n,1,seed)*256,py=hash(n,2,seed)*128,w=3+hash(n,3,seed)*11;x.fillStyle='rgba(255,255,255,'+(.22+hash(n,4,seed)*.5).toFixed(2)+')';x.fillRect(px,py,w,1.2);if(hash(n,5,seed)>.7)x.fillRect(px+w*.25,py+1.2,w*.5,1)}return c}
function buildTerrain(){
  const GA=[146,170,84],GB=[122,152,72],GC=[104,134,64],DRY=[176,162,104],HILL=[136,140,92];
  const SANDC=[210,194,150],WETC=[168,152,114],BED=[178,164,124],SHAL=[112,170,168];
  const ht=new Float32Array(N*N);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=idx(i,j);ht[k]=water[k]?-.6:mount[k]*1.7+vnoise(i*.13+5,j*.13+9,31)*2.4+vnoise(i*.4,j*.4,32)*.5}
  const Hh=(i,j)=>inb(i,j)?ht[idx(i,j)]:0;
  const wd=new Uint8Array(N*N);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=idx(i,j);if(!water[k])continue;let m=6;
    for(let dj=-4;dj<=4;dj++)for(let di=-4;di<=4;di++){const a=i+di,b=j+dj;if(inb(a,b)&&!water[idx(a,b)])m=Math.min(m,Math.max(Math.abs(di),Math.abs(dj)))}wd[k]=m}
  const cw=Math.ceil(N*64*TS),ch=Math.ceil(N*32*TS)+4;
  const mkc=()=>{const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.setTransform(TS,0,0,TS,N*32*TS,0);x.lineWidth=1.2;return[c,x]};
  const [t1,c1]=mkc(),[t3,c3]=mkc(),[wm,cm]=mkc();cm.fillStyle=cm.strokeStyle='#fff';
  const quad=(x,i,j)=>{const a=P(i,j),b=P(i+1,j),cc=P(i+1,j+1),d=P(i,j+1);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(cc[0],cc[1]);x.lineTo(d[0],d[1]);x.closePath();x.fill();x.stroke()};
  for(let j=-4;j<N+4;j++)for(let i=-4;i<N+4;i++){
    if(!inb(i,j)){if(water[idx(clamp(i,0,N-1),clamp(j,0,N-1))])quad(cm,i,j);continue}
    const k=idx(i,j),n=vnoise(i*.09,j*.09,1)*.65+vnoise(i*.23,j*.23,2)*.35;
    let c=mix(GA,GB,clamp((n-.28)/.45,0,1));

    c=mix(c,DRY,smooth(.52,.7,vnoise(i*.07+9,j*.07,3))*.8);
    const lv=mount[k];
    if(lv===1)c=mix(c,HILL,.45);else if(lv===2)c=mix(c,[110,112,74],.6);else if(lv>=3)c=mix([112,106,98],[172,166,156],vnoise(i*.45,j*.45,14));
    if(sand[k]&&lv<3){c=mix(c,SANDC,.9);if(DIRS.some(d=>inb(i+d[0],j+d[1])&&water[idx(i+d[0],j+d[1])]))c=mix(c,WETC,.5)}
    let sh=(Hh(i+1,j)-Hh(i-1,j))*.11+(Hh(i,j+1)-Hh(i,j-1))*.045;if(lv>=3)sh*=1.8;

    c3.fillStyle=c3.strokeStyle=rgb(wc);quad(c3,i,j);
  }
  terr=document.createElement('canvas');terr.width=cw;terr.height=ch;
  const c2=terr.getContext('2d'),w=cw,h=ch;
  const blurDraw=(dst,src,px)=>{try{dst.filter='blur('+px+'px)'}catch(e){}dst.drawImage(src,0,0);dst.filter='none'};
  blurDraw(c2,t1,5);
  const mb=document.createElement('canvas');mb.width=w;mb.height=h;const mbx=mb.getContext('2d');blurDraw(mbx,wm,8);
  let wa=null,foam=null;

    for(let q=0;q<w*h;q++){const o=q*4,a=d[o+3]/255,m=smooth(.4,.6,a),e=(a-.5)/.14,f=Math.exp(-e*e);
      d[o]=d[o+1]=d[o+2]=255;d[o+3]=m*255;fd[o]=232;fd[o+1]=246;fd[o+2]=242;fd[o+3]=f*100}
    mbx.putImageData(id,0,0);wa=mb;

function roadAt(x,y){
  if(!inb(x,y))return false;
  const k=idx(x,y);
  return road[k]>0||froad[k]>0||uroad[k]>0;
}
function getRoadFacing(b){
  const fw=b.fw||1;
  let sY=0,sX=0,nX=0,nY=0;
  for(let k=0;k<fw;k++){
    if(roadAt(b.i+k,b.j+fw))sY++;
    if(roadAt(b.i+fw,b.j+k))sX++;
    if(roadAt(b.i-1,b.j+k))nX++;
    if(roadAt(b.i+k,b.j-1))nY++;
  }
  if(sX>0&&sY===0)return true;
  if(sY>0&&sX===0)return false;
  if(sX>0&&sY>0){
    if(sX>sY)return true;
    if(sY>sX)return false;
    return b.flip?true:false;
  }
  if(nY>0&&nX===0)return true;
  if(nX>0&&nY===0)return false;
  if(nY>0&&nX>0)return nY>nX;
  return null;
}
function autoFace(b){
  if(!b||b.man)return;
  const f=getRoadFacing(b);

}
function faceFlip(i,j){

  for(let di=-r;di<=r;di++){

      if(inb(ci,cj)){

}

  const c0=coins;placeRaw(t,v,i,j);stroke.cost+=c0-coins;stroke.n++;
}
function closeStroke(){if(stroke&&stroke.n>0){stroke.after=snapshot();undoS.push(stroke);if(undoS.length>40)undoS.shift();redoS.length=0}stroke=null;undoUI();if(terrDirty){terrDirty=false;buildTerrain()}}

function redo(){closeStroke();const s=redoS.pop();if(!s){toast('Nothing to redo.',1200);return}if(coins<s.cost){redoS.push(s);toast('Not enough funds to redo.',1600);return}restoreSnap(s.after);coins-=s.cost;undoS.push(s);undoUI();toast('Redone.',900)}
function undoUI(){const u=document.getElementById('bUndo'),r=document.getElementById('bRedo');if(u)u.disabled=!undoS.length;if(r)r.disabled=!redoS.length}

/* view rotation: the whole map turns a quarter step */
function rotateWorld(dir){

  for(const a of[road,froad,uroad,rail,frail,urail,field,tree,scorch,water,mount,sand,keepDry,mtr,fmr,umtr]){const o=a.slice();for(let j=0;j<N;j++)for(let i=0;i<N;i++){const p=mp(i,j);a[idx(p[0],p[1])]=o[idx(i,j)]}}
  const ob=bld.slice();bld.fill(null);bocc.fill(null);for(const b of ob)if(b){const f=b.fw||1,p=mp(b.i,b.j),p2=mp(b.i+f-1,b.j+f-1);b.i=Math.min(p[0],p2[0]);b.j=Math.min(p[1],p2[1]);putB(b)}
  const oo=Array.from(OWN),on=DNAMES.slice();
  for(let q=0;q<25;q++){const qx=q%5,qy=(q/5)|0,nx=dir>0?4-qy:qy,ny=dir>0?qx:4-qx,nq=ny*5+nx;OWN[nq]=oo[q];DNAMES[nq]=on[q]}
  cars.length=0;pops.length=0;smoke.length=0;trainDirty=true;mDirty=true;hover=null;undoS.length=0;redoS.length=0;
  viewRot=(viewRot+(dir>0?1:3))%4;buildTerrain();eAcc=9;E=econCalc();undoUI();
}

function camStep(dt){
  if(menuOpen||finOpen){vx=vy=0;return}
  const tx=((keys.has('a')||keys.has('arrowleft'))?1:0)-((keys.has('d')||keys.has('arrowright'))?1:0),ty=((keys.has('w')||keys.has('arrowup'))?1:0)-((keys.has('s')||keys.has('arrowdown'))?1:0);

  if(Math.abs(vx)>.5||Math.abs(vy)>.5){cam.x+=vx*dt;cam.y+=vy*dt;limitCam()}
  if(Math.abs(Math.log(zoomPend))>.003){const f=Math.pow(zoomPend,Math.min(1,dt*9));zoomAt(W/2,H/2,f);zoomPend/=f;limitCam()}
}
addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;
  const k=e.key.toLowerCase();
  if(k==='escape'){if(menuOpen){if(menuMode==='ingame')menuShow(false)}else if(finOpen)finShow(false);else if(tool!=='hand')selectTool('hand');else menuShow(true,'ingame');return}
  if(menuOpen||finOpen)return;
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(['arrowleft','arrowright','arrowup','arrowdown'].includes(k)||['w','a','s','d'].includes(k)){keys.add(k);e.preventDefault();return}
  if(k==='q')turn(-1);else if(k==='e')turn(1);
